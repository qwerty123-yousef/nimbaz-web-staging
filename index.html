<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/nimbaz-web-staging/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نیم‌باز - خرید و فروش و آگهی">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="نیم‌باز">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>نیم‌باز</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #nb-help {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: none;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    #nb-help .box {
      background: #fff;
      color: #1f2933;
      max-width: 420px;
      width: 100%;
      border-radius: 16px;
      padding: 22px 20px 24px;
      font-family: Tahoma, sans-serif;
      direction: rtl;
      line-height: 2.1;
      font-size: 14px;
    }
    #nb-help h3 { margin: 0 0 8px; color: #6a1b9a; font-size: 16px; }
    #nb-help b { color: #6a1b9a; }
    #nb-help button {
      margin-top: 16px;
      width: 100%;
      background: #6a1b9a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 20px;
      font-family: Tahoma, sans-serif;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body dir="rtl">
  <div id="nb-help">
    <div class="box">
      <h3>نصب نیم‌باز روی گوشی</h3>
      <span id="nb-help-text"></span>
      <button type="button" id="nb-help-close">باشه</button>
    </div>
  </div>

  <script>
    (function () {
      var help = document.getElementById('nb-help');
      var helpText = document.getElementById('nb-help-text');
      var deferred = null;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
      });
      window.addEventListener('appinstalled', function () { deferred = null; });

      function ios() {
        var ua = navigator.userAgent || '';
        return /iPad|iPhone|iPod/.test(ua)
          || (ua.indexOf('Mac') !== -1 && 'ontouchend' in document);
      }
      function android() {
        return /android/i.test(navigator.userAgent || '');
      }

      function showHelp() {
        helpText.innerHTML = ios()
          ? 'دکمه‌ی <b>اشتراک‌گذاری</b> مرورگر را بزنید (مربع با یک فلش رو به بالا — معمولاً پایین صفحه).'
            + '<br>سپس در فهرست باز‌شده، گزینه‌ی <b>«Add to Home Screen»</b> را انتخاب و تایید کنید.'
          : 'از منوی مرورگر خودتان (بالای صفحه) گزینه‌ی '
            + '<b>«افزودن به صفحه اصلی»</b> یا <b>«Install app»</b> را بزنید و تایید کنید.'
            + '<br>اگر این گزینه را نمی‌بینید، مرورگر <b>Chrome</b> این کار را ساده‌تر انجام می‌دهد.';
        help.style.display = 'flex';
      }
      document.getElementById('nb-help-close').addEventListener('click', function () {
        help.style.display = 'none';
      });
      help.addEventListener('click', function (e) {
        if (e.target === help) help.style.display = 'none';
      });

      // API که کد فلاتر صدا می‌زند
      window.nbPwa = {
        // آیا اصلاً پیشنهاد نصب معنا دارد؟ (فقط مرورگر موبایل و هنوز نصب نشده)
        canOffer: function () {
          try {
            var standalone = (window.matchMedia
                && window.matchMedia('(display-mode: standalone)').matches)
              || window.navigator.standalone === true;
            var coarse = window.matchMedia
              && window.matchMedia('(pointer: coarse)').matches;
            return !!coarse && !standalone;
          } catch (e) { return false; }
        },
        // 'ios' | 'android' | 'other'
        platform: function () {
          if (ios()) return 'ios';
          if (android()) return 'android';
          return 'other';
        },
        // آیفون: راهنمای افزودن به صفحه‌ی اصلی (چون ای‌پی‌کا فقط اندروید است)
        showAddToHome: function () { showHelp(); },
        // اندروید: دانلود فایل نصبی اپلیکیشن
        downloadApk: function () {
          window.location.href = 'https://nimbaz.ir/nimbaz.apk';
        }
      };
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
